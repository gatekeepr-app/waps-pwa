<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 360px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #000; color: #fff; padding: 16px; }
    h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px; color: #fff; }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #555; margin-bottom: 4px; }
    input { width: 100%; height: 40px; background: #111; border: 1px solid #1a1a1a; border-radius: 6px; padding: 0 12px; color: #fff; font-size: 13px; outline: none; }
    input:focus { border-color: #fff; }
    button { width: 100%; height: 42px; background: #fff; color: #000; border: none; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 4px; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.secondary { background: transparent; border: 1px solid #1a1a1a; color: #555; }
    .status { margin-top: 10px; font-size: 12px; color: #555; text-align: center; }
    .status.success { color: #4ade80; }
    .status.error { color: #ef4444; }
    .link { display: block; text-align: center; margin-top: 12px; font-size: 10px; color: #333; text-decoration: none; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; }
    .link:hover { color: #555; }
    .tabs { display: flex; gap: 2px; margin-bottom: 14px; }
    .tab { flex: 1; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; border-radius: 6px; cursor: pointer; border: none; background: transparent; color: #555; }
    .tab.active { background: #fff; color: #000; }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" id="tabSave">Save</button>
    <button class="tab" id="tabConnect">Connect</button>
    <button class="tab" id="tabSettings">Settings</button>
  </div>

  <div id="saveView">
    <h1>Save to Waps</h1>
    <div class="field">
      <label>URL</label>
      <input type="url" id="urlInput" readonly>
    </div>
    <div class="field">
      <label>Title (optional)</label>
      <input type="text" id="titleInput" placeholder="Page title">
    </div>
    <button id="saveBtn">Save Bookmark</button>
    <div class="status" id="status"></div>
  </div>

  <div id="connectView" style="display:none;">
    <h1>Pair with App</h1>
    <div class="field">
      <label>Pairing Code</label>
      <input type="text" id="pairCodeInput" placeholder="e.g. ABC123" maxlength="6" style="text-transform:uppercase; letter-spacing:0.2em; font-size:18px; text-align:center;">
    </div>
    <button id="pairBtn">Connect</button>
    <div class="status" id="pairStatus"></div>
  </div>

  <div id="settingsView" style="display:none;">
    <h1>Settings</h1>
    <div class="field">
      <label>API Key</label>
      <input type="text" id="apiKeyInput" placeholder="Paste your Waps API key">
    </div>
    <div class="field">
      <label>Server URL</label>
      <input type="url" id="convexUrlInput" placeholder="https://your-project.convex.site">
    </div>
    <button id="saveKeyBtn">Save Settings</button>
    <div class="status" id="settingsStatus"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
